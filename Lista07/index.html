<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>
<body>
    <form>
        <label>Data de nascimento:</label>
        <input type="text" id="nascimento" value="25/12/2005">
        <input type="button" value="Validar" onclick="validar('nascimento', regexNascimento)">
        <br><br>

        <label>CPF:</label>
        <input type="text" id="cpf" value="123.456.789-09" onKeyPress="inserirMascara('cpf','xxx.xxx.xxx-xx')">
        <input type="button" value="Validar" onclick="validar('cpf', regexCpf)">
        <br><br>

        <label>Número de matrícula:</label>
        <input type="text" id="matricula" value="IFTM-123/456-A1">
        <input type="button" value="Validar" onclick="validar('matricula', regexMatricula)">
        <br><br>

        <label>Código da disciplina:</label>
        <input type="text" id="disciplina1" value="MT-12.345-IFTM" onKeyPress="inserirMascara('disciplina1','xx-xx.xxx-xxxx')">
        <input type="button" value="Validar" onclick="validar('disciplina1', regexDisciplina1)">
        <br><br>

        <label>Código da disciplina (versão 2):</label>
        <input type="text" id="disciplina2" value="MT-12.345-iftm" onKeyPress="inserirMascara('disciplina2','xx-xx.xxx-xxxx')">
        <input type="button" value="Validar" onclick="validar('disciplina2', regexDisciplina2)">
        <br><br>

        <label>Código da disciplina (versão 3):</label>
        <input type="text" id="disciplina3" value="M T-12.345-I F T M">
        <input type="button" value="Validar" onclick="validar('disciplina3', regexDisciplina3)">
        <br><br>

        <label>Nome do campus:</label>
        <input type="text" id="campus" value="IFTM campus Uberlândia Centro">
        <input type="button" value="Validar" onclick="validar('campus', regexCampus)">
        <br><br>

        <label>Telefone:</label>
        <input type="text" id="telefone1" value="+55(34)99999-8888" onKeyPress="inserirMascara('telefone1','+xx(xx)xxxxx-xxxx')">
        <input type="button" value="Validar" onclick="validar('telefone1', regexTelefone1)">
        <br><br>

        <label>Telefone (versão 2):</label>
        <input type="text" id="telefone2" value="(34) 99999-8888">
        <input type="button" value="Validar" onclick="validar('telefone2', regexTelefone2)">
        <br><br>

        <label>Altura:</label>
        <input type="text" id="altura" value="1,75">
        <input type="button" value="Validar" onclick="validar('altura', regexAltura)">
        <br><br>

        <label>Faturamento anual:</label>
        <input type="text" id="faturamento" value="R$1.500,41">
        <input type="button" value="Validar" onclick="validar('faturamento', regexFaturamento)">
        <br><br>

        <label>Cronômetro:</label>
        <input type="text" id="cronometro" value="12:30:45:99" onKeyPress="inserirMascara('cronometro','xx:xx:xx:xx')">
        <input type="button" value="Validar" onclick="validar('cronometro', regexCronometro)">
    </form>

    <script src="js/jMaskWiFi.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
