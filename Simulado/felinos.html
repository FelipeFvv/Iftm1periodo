<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos felinos</title>
    <link rel="stylesheet" href="css/felinos.css">
    <script src="js/felinos.js" defer></script>
</head>

<body>
    <main>
        <div>
            <img src="Imagens/gato01.gif" id="gato1" width="100">
            <p>Clique em mim!</p>
        </div>

        <div>
            <img src="Imagens/gato02.gif" id="gato2" width="100">
            <p>Clique sobre mim várias vezes!</p>
            <p>Carinhos: <span id="carinhos">0</span></p>
        </div>

        <div>
            <img src="Imagens/gato03.gif" id="gato3" width="100">
            <p>Passe o cursor do mouse sobre mim!</p>
        </div>

        <div>
            <img src="Imagens/gato04.gif" id="gato4" width="100">
            <p id="textoGato4">lá lá lá lá lá lá</p>
        </div>

        <div>
            <img src="Imagens/gato05.gif" id="gato5" width="100">
            <p><input type="button" value="Gerar número da sorte" id="gerar"></p>
            <input type="text" id="numeroSorte" readonly>
        </div>
    </main>
</body>

</html>
