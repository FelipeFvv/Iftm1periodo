<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado do Sorteio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f6f8;
        }
        .bola {
            display: inline-block;
            width: 50px;
            height: 50px;
            line-height: 50px;
            border-radius: 50%;
            background-color: #2e7d32;
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin: 8px;
        }
        a {
            display: inline-block;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Números sorteados</h1>

    <div>
        <span class="bola" th:each="num : ${numeros}" th:text="${num}">0</span>
    </div>

    <a th:href="@{/}">Sortear novamente</a>
</body>
</html>
